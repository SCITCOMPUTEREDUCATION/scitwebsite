```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate | SCIT</title>

    <style>

        body{
            font-family:'Segoe UI', Arial, sans-serif;
            margin:0;
            padding:0;
            background:#ffffff;
            color:#4a0404;
            display:flex;
            flex-direction:column;
            min-height:100vh;
            position:relative;
        }

        /* WATERMARK LOGO */

        body::before{
            content:"";
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:450px;
            height:450px;
            background-image:url('logo.jpg');
            background-repeat:no-repeat;
            background-position:center;
            background-size:contain;
            opacity:0.06;
            z-index:0;
            pointer-events:none;
        }

        nav{
            background:white;
            display:flex;
            justify-content:center;
            position:sticky;
            top:0;
            z-index:1000;
            border-bottom:2px solid #4a0404;
            flex-wrap:wrap;
        }

        nav a{
            color:#4a0404;
            text-decoration:none;
            padding:15px 25px;
            font-weight:800;
            font-size:0.9rem;
            text-transform:uppercase;
        }

        .container{
            flex:1;
            max-width:700px;
            margin:40px auto;
            padding:0 20px;
            text-align:center;
            position:relative;
            z-index:1;
        }

        .verify-card{
            background:#fdf2f2;
            padding:30px;
            border-radius:20px;
            border:1px solid #ddd;
            border-top:10px solid #4a0404;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        input[type="text"]{
            width:100%;
            max-width:550px;
            padding:12px;
            font-size:0.95rem;
            border:2px solid #4a0404;
            border-radius:8px;
            margin-bottom:20px;
            text-align:center;
            font-weight:bold;
            box-sizing:border-box;
        }

        .btn-verify{
            background:#4a0404;
            color:white;
            border:none;
            padding:12px 40px;
            font-size:1rem;
            font-weight:700;
            border-radius:8px;
            cursor:pointer;
            text-transform:uppercase;
            transition:0.3s;
        }

        .btn-verify:hover{
            opacity:0.9;
        }

        #result{
            margin-top:30px;
            display:none;
            text-align:left;
            animation:fadeIn 0.5s;
        }

        .status-box{
            padding:20px;
            border-radius:10px;
            border:2px solid;
        }

        .valid{
            background:#e7f4e9;
            color:#155724;
            border-color:#c3e6cb;
        }

        .invalid{
            background:#f8d7da;
            color:#721c24;
            border-color:#f5c6cb;
        }

        .data-table{
            width:100%;
            margin-top:15px;
            border-collapse:collapse;
            background:white;
            border-radius:8px;
            overflow:hidden;
        }

        .data-table td{
            padding:12px;
            border:1px solid #ddd;
            font-weight:600;
            color:#333;
        }

        .label{
            background:#f8f8f8;
            color:#4a0404;
            width:40%;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        footer{
            background:#4a0404;
            color:white;
            text-align:center;
            padding:25px 20px;
            margin-top:auto;
            position:relative;
            z-index:1;
        }

        @media(max-width:768px){

            nav a{
                padding:10px;
                font-size:0.8rem;
            }

        }

    </style>
</head>

<body>

    <nav>
        <a href="scit1.html">HOME</a>
        <a href="courses.html">COURSE</a>
        <a href="certificate.html">CERTIFICATE</a>
        <a href="media.html">MEDIA</a>
        <a href="contact.html">CONTACT</a>
    </nav>

    <div class="container">

        <div class="verify-card">

            <h2 style="text-transform:uppercase; margin-top:0;">
                Online Verification
            </h2>

            <p>
                Enter Certificate Number to check student details:
            </p>

            <input
                type="text"
                id="certNo"
                placeholder="Enter Certificate No. (e.g. SCIT/COURSE/1000)"
            >

            <br>

            <button class="btn-verify" onclick="checkCertificate()">
                Verify Now
            </button>

            <div id="result"></div>

        </div>

    </div>

    <script>

        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9zIi7L843P-vODgmS0y7Iy9fygN5vpnqxiOD2U8X9hOGuc7aBPVC9id-jc1khsPOXgg2cluIB-YVF/pub?output=csv";

        async function checkCertificate(){

            const certNumber = document
                .getElementById("certNo")
                .value
                .trim()
                .toUpperCase();

            const resultDiv = document.getElementById("result");

            if(certNumber === ""){

                alert("Please enter certificate number!");

                return;
            }

            resultDiv.style.display = "block";

            resultDiv.innerHTML =
                "<p style='text-align:center;'>Searching Database...</p>";

            try{

                const response = await fetch(sheetURL);

                if(!response.ok){

                    throw new Error("Sheet not accessible");
                }

                const data = await response.text();

                const rows = data
                    .trim()
                    .split("\n")
                    .map(row =>
                        row
                            .split(",")
                            .map(cell =>
                                cell.replace(/"/g, "").trim()
                            )
                    );

                const student = rows.find(row =>
                    row[0] &&
                    row[0].toUpperCase() === certNumber
                );

                if(student){

                    resultDiv.innerHTML = `

                        <div class="status-box valid">

                            <h3 style="margin:0; text-align:center;">
                                ✅ VERIFIED & VALID
                            </h3>

                            <table class="data-table">

                                <tr>
                                    <td class="label">
                                        Student Name
                                    </td>

                                    <td>${student[1]}</td>
                                </tr>

                                <tr>
                                    <td class="label">
                                        Certificate No
                                    </td>

                                    <td>${student[0]}</td>
                                </tr>

                                <tr>
                                    <td class="label">
                                        Course Name
                                    </td>

                                    <td>${student[2]}</td>
                                </tr>

                                <tr>
                                    <td class="label">
                                        Percentage
                                    </td>

                                    <td>${student[3]}</td>
                                </tr>

                                <tr>
                                    <td class="label">
                                        Final Grade
                                    </td>

                                    <td>${student[4]}</td>
                                </tr>

                            </table>

                            <p style="
                                text-align:center;
                                font-size:0.8rem;
                                margin-top:10px;
                            ">
                                This is an electronically generated
                                status from SCIT Database.
                            </p>

                        </div>
                    `;

                }else{

                    resultDiv.innerHTML = `

                        <div class="status-box invalid">

                            <h3 style="margin:0; text-align:center;">
                                ❌ NOT FOUND
                            </h3>

                            <p style="text-align:center;">

                                The Certificate Number
                                <b>${certNumber}</b>

                                does not exist in our records.

                            </p>

                        </div>
                    `;
                }

            }catch(error){

                console.error(error);

                resultDiv.innerHTML = `

                    <div class="status-box invalid">

                        <h3 style="text-align:center;">
                            Database Error
                        </h3>

                        <p style="text-align:center;">

                            Unable to connect Google Sheet Database.

                        </p>

                    </div>
                `;
            }
        }

    </script>

        <br>

        <small>
            Building Careers through Quality Technical Education
        </small>

    </footer>

</body>
</html>
